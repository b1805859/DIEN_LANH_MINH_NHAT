<!doctype html>
<meta charset="utf-8">
<pre id="out"></pre>
<script>
  const img = new Image();
  img.src = 'v4.png';
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = 1660; c.height = 947;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const pixel = (x, y) => {
      let r = 0, g = 0, b = 0, n = 0;
      const d = ctx.getImageData(x - 1, y - 1, 3, 3).data;
      for (let i = 0; i < 9; i++) { r += d[i * 4]; g += d[i * 4 + 1]; b += d[i * 4 + 2]; n++; }
      return [Math.round(r / n), Math.round(g / n), Math.round(b / n)];
    };
    const rows = [385, 395, 405, 415, 425, 435, 445, 455, 465, 475, 485, 495];
    const xs = [1498, 1504, 1510, 1516, 1522, 1528, 1534, 1540];
    let out = 'y\\\\x  ' + xs.join('  ') + '\n';
    for (const y of rows) {
      out += y + '  ' + xs.map(x => { const [r, g, b] = pixel(x, y); return `${r},${g},${b}`; }).join('\n');
      out += '\n';
    }
    document.getElementById('out').textContent = out;
  };
</script>
