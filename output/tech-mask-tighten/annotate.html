<script>
  const grid = (gId, labelId, from, to, step, dashedEvery) => {
    const g = document.getElementById(gId), lb = document.getElementById(labelId);
    let s = '', t = '';
    for (let x = from; x <= to; x += step) {
      s += `<line x1="${x}" y1="0" x2="${x}" y2="${947}" />`;
      t += `<text x="${x + 3}" y="14">${x}</text><text x="${x + 3}" y="940">${x}</text>`;
    }
    for (let y = 0; y <= 947; y += step) {
      s += `<line x1="0" y1="${y}" x2="1660" y2="${y}" />`;
      t += `<text x="4" y="${y + 4}">${y}</text><text x="1600" y="${y + 4}">${y}</text>`;
    }
    g.innerHTML = s; lb.innerHTML = t;
  };
  grid('grid', 'gridLabels', 1250, 1660, 50);
  grid('grid-head', 'gridLabels-head', 1300, 1660, 25);
  grid('grid-shoulder', 'gridLabels-shoulder', 1250, 1660, 25);
  const zoom = (clipId, sx, sy, scale, noteId, text) => {
    const clip = document.getElementById(clipId);
    clip.style.transform = `scale(${scale}) translate(${-sx}px, ${-sy}px)`;
    document.getElementById(noteId).textContent =
      `${text} — source rect x ${sx}..${sx + 800 / scale}, y ${sy}..${sy + 600 / scale} (3x)`;
  };
  zoom('clipHead', 1330, 300, 3, 'noteHead', 'head');
  zoom('clipShoulder', 1330, 480, 3, 'noteShoulder', 'shoulders');
</script>
