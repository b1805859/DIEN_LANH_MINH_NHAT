<!doctype html>
<meta charset="utf-8">
<canvas id="c" width="1660" height="947" style="display:none"></canvas>
<pre id="out"></pre>
<script>
  const img = new Image();
  img.src = 'v4.png';
  img.onload = () => {
    const ctx = document.getElementById('c').getContext('2d');
    ctx.drawImage(img, 0, 0);
    const data = ctx.getImageData(0, 0, 1660, 947).data;
    const probe = (x, y) => {
      const i = (y * 1660 + x) * 4;
      return [x, y, data[i], data[i + 1], data[i + 2]];
    };
    const pts = [
      // hair right / ear
      [1546, 430], [1552, 440], [1556, 450], [1560, 460], [1555, 470],
      [1540, 476], [1525, 480], [1512, 484], [1505, 490], [1502, 498],
      // neck right → collar outer
      [1508, 505], [1512, 512], [1516, 518], [1522, 524], [1530, 530], [1540, 536], [1550, 540], [1560, 544], [1570, 548], [1580, 552], [1590, 556], [1600, 560], [1610, 562], [1620, 566], [1630, 570], [1640, 574], [1650, 578],
      // shoulder crown / top edge region
      [1640, 600], [1640, 620], [1635, 640], [1630, 660],
      // left neck/shoulder
      [1410, 505], [1400, 520], [1390, 535], [1372, 550], [1350, 560], [1335, 570], [1320, 580], [1310, 592], [1302, 610], [1296, 630], [1288, 650], [1282, 670], [1278, 690], [1272, 712], [1268, 730], [1264, 748], [1262, 765],
      // lower left arm & bottom
      [1260, 780], [1270, 790], [1282, 800], [1294, 806], [1306, 810], [1318, 814], [1330, 818], [1300, 850], [1310, 880], [1316, 900], [1318, 920], [1312, 940],
      // right lower arm
      [1600, 640], [1596, 660], [1596, 680], [1594, 700], [1594, 720], [1596, 740], [1598, 760], [1600, 780], [1602, 800], [1600, 820], [1596, 840], [1594, 860], [1594, 880], [1594, 900], [1596, 920], [1596, 940],
      // plant / collar left of neck
      [1470, 555], [1480, 560], [1490, 565], [1500, 570], [1510, 575], [1520, 580], [1530, 585], [1540, 590], [1550, 595], [1560, 600], [1570, 605], [1580, 610],
    ];
    document.getElementById('out').textContent = pts.map(p => {
      const [x, y, r, g, b] = probe(p[0], p[1]);
      return `${String(x).padStart(4)},${String(y).padStart(4)}  rgb ${String(r).padStart(3)},${String(g).padStart(3)},${String(b).padStart(3)}`;
    }).join('\n');
  };
</script>
