<!doctype html>
<meta charset="utf-8">
<canvas id="c" width="1660" height="947"></canvas>
<script>
  const img = new Image();
  img.src = 'v4.png';
  img.onload = () => {
    const ctx = document.getElementById('c').getContext('2d');
    ctx.drawImage(img, 0, 0);
    const d = ctx.getImageData(0, 0, 1660, 947).data;
    const W = 1660;
    const lum = i => 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    const isPerson = (x, y) => {
      const i = (y * W + x) * 4, r = d[i], g = d[i + 1], b = d[i + 2];
      const blue = b - r > 40 && b > 90 && g < b + 20 && g > r - 10;
      const skin = r - b > 45 && r > 140 && r - g < 90 && g - b < 60;
      const hair = lum(i) < 85;
      return blue || skin || hair;
    };
    const run = 8;
    const edges = [];
    for (let y = 320; y <= 946; y += 3) {
      const row = { y, l: null, r: null };
      // leftmost x with run of consecutive person pixels
      for (let x = 1250; x <= 1640 - run; x++) {
        let ok = true;
        for (let k = 0; k < run; k++) if (!isPerson(x + k, y)) { ok = false; break; }
        if (ok) { row.l = x; break; }
      }
      for (let x = 1640; x >= 1250 + run; x--) {
        let ok = true;
        for (let k = 0; k < run; k++) if (!isPerson(x - k, y)) { ok = false; break; }
        if (ok) { row.r = x; break; }
      }
      edges.push(row);
    }
    // head top: first y with a person run per column
    const tops = [];
    for (let x = 1360; x <= 1560; x += 10) {
      let top = null;
      for (let y = 300; y <= 420; y++) {
        let ok = true;
        for (let k = 0; k < run; k++) if (!isPerson(x, y + k)) { ok = false; break; }
        if (ok) { top = y; break; }
      }
      tops.push({ x, top });
    }
    window.__res = { edges, tops };
    document.title = 'res ' + edges.length;
  };
</script>
