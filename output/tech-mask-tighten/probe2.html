<!doctype html>
<meta charset="utf-8">
<pre id="out"></pre>
<script>
  const img = new Image();

  img.onload = () => {

    c.width = 1660; c.height = 947;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const data = ctx.getImageData(0, 0, 1660, 947).data;
    const pts = [

      [1490, 470], [1498, 460], [1530, 470], [1545, 480], [1555, 495], [1553, 510], [1550, 520], [1545, 528], [1540, 534],
      [1373, 370], [1372, 380], [1375, 350], [1383, 360], [1397, 340], [1408, 330], [1424, 325], [1440, 322], [1455, 330], [1500, 350], [1510, 365], [1516, 385], [1517, 400], [1512, 420], [1508, 440], [1504, 455]

    document.getElementById('out').textContent = pts.map(p => {

      return `${String(p[0]).padStart(4)},${String(p[1]).padStart(4)}  rgb ${String(data[i]).padStart(3)},${String(data[i + 1]).padStart(3)},${String(data[i + 2]).padStart(3)}`;
    }).join('\n');
  };
</script>
